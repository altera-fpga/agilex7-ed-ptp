name: Build Software ANLT
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      triggered_by_schedule:
        type: boolean
        required: false
        default: false
      triggered_by_tag_push:
        type: boolean
        required: false
        default: false
      release_tag:
        type: string
        required: false
        default: ""
      branch_name:
        required: false
        type: string
      triggered_by_quartus_upgrade:
        type: boolean
        required: false
        default: false
      quartus_upgrade_branch:
        required: false
        type: string

jobs:
  software-build:
    runs-on: [self-hosted, psgpac]
    env:
      TARGET_BRANCH: ${{ inputs.branch_name || inputs.quartus_upgrade_branch || github.ref_name || 'GSRD2.0TestingBranch' }}
      WORKDIR: /nfs/site/disks/pac_release_1/github/psgpac/${{ github.repository }}/${{ github.run_id }}.${{ github.run_attempt }}
      DESTDIR: /nfs/site/disks/pac_release_1/github/psgpac/${{ github.repository }}/${{ github.run_id }}.${{ github.run_attempt }}/dk-si-agi027fd-oobe/ptp/software/output_files
      CONTAINER: /nfs/site/disks/pac_release_1/github/psgpac/${{ github.repository }}/container/ubuntu2204.sif
      SSTATE_DIR: /nfs/site/disks/pac_release_1/github/psgpac/${{ github.repository }}/sstate_cache/ubuntu2204
      SED_ARTIFACT_PATH: /nfs/site/disks/pac_release_1/github/psgpac/sed/build
      SED_PTP_2x25G_FM87_MCQOS_SW_PATH: 1588ptp/agilex7/fm87/pdk/2x25G_MCQOS
      ARTIFACT_NAME_PREFIX: agilex7_ed_1588ptp
      QUARTUS_UPGRADE_PATH: /nfs/site/disks/pac_release_1/github/psgpac/sed/quartus_upgrade/build

    steps:
      - name: Capture start time
        id: start
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Create workdir
        id: workdir
        run: |
          mkdir -pv $WORKDIR
          echo "SED_ARTIFACT_PATH=${{ env.SED_ARTIFACT_PATH }}" >> $GITHUB_ENV
      
      - name: Get date
        id: date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_name || inputs.quartus_upgrade_branch || github.ref_name || 'GSRD2.0TestingBranch' }}

      - name: Copy inputs
        run: |
          rsync -rl --exclude=.git "$GITHUB_WORKSPACE"/. "$WORKDIR"

      - name: Create BUILD PATH and BUILD FLAG DIR
        run: |
          if [[ "${{ inputs.triggered_by_tag_push }}" == "true" ]]; then
            echo "Push Tag triggered"
            echo "RELEASE=1" >> $GITHUB_ENV
            echo "TAG=${{ inputs.release_tag }}" >> $GITHUB_ENV
            echo "ARTIFACT_NAME_PREFIX=${{ env.ARTIFACT_NAME_PREFIX }}-${{ inputs.release_tag }}-${{ env.DATE }}" >> $GITHUB_ENV
          elif [[ "${{ inputs.triggered_by_quartus_upgrade }}" == "true" ]]; then
            echo "Quartus upgrade triggered"
            echo "QUARTUS=1" >> $GITHUB_ENV
            echo "ARTIFACT_NAME_PREFIX=${{ env.ARTIFACT_NAME_PREFIX }}-PR-${{ env.DATE }}" >> $GITHUB_ENV
          else
            # schedule, workflow_dispatch, or workflow_call without flags → nightly NFS tree
            echo "Nightly/manual SW build (NIGHTLY=1)"
            echo "NIGHTLY=1" >> $GITHUB_ENV
            echo "ARTIFACT_NAME_PREFIX=${{ env.ARTIFACT_NAME_PREFIX }}-${{ env.DATE }}" >> $GITHUB_ENV
          fi

      - name: Debug DESTDIR before upload
        if: always()
        run: |
          echo "DESTDIR=$DESTDIR"
          ls -la "$DESTDIR" 2>/dev/null || echo "DESTDIR missing or empty"

      - name: Build Yocto image
        run: |
          set -eo pipefail
          # Optional flags unset on workflow_dispatch nightly — default empty for set-safe env pass-through
          RELEASE="${RELEASE:-}"
          NIGHTLY="${NIGHTLY:-}"
          QUARTUS="${QUARTUS:-}"
          TAG="${TAG:-}"
          echo "Building software for $TARGET_BRANCH"
          # BUILD_ROOT=NFS sources; YOCTO_TMPDIR set inside script to node-local /tmp
          # arc submit often returns 0 even when the job exits -1004 — parse status line
          ARC_LOG=$(mktemp)
          # Unquoted -I tokens (quoted string caused ARC -303). rm_work in kas.yml reduces /tmp pressure.
          arc submit -I ostype/ubuntu22 ncpus=8 mem=96G priority=99 timeout=8h iwd=$WORKDIR nb_container=$CONTAINER -- env http_proxy=$http_proxy https_proxy=$https_proxy GITHUB_SERVER_URL=$GITHUB_SERVER_URL GITHUB_REPOSITORY=$GITHUB_REPOSITORY GITHUB_REF=$TARGET_BRANCH GITHUB_USER=${{ secrets.GSRD_GITHUB_USER || github.actor }} GITHUB_TOKEN=${{ secrets.GSRD_GITHUB_PAT || secrets.GITHUB_TOKEN }} GITHUB_ACTIONS=true SSTATE_DIR=$SSTATE_DIR DESTDIR=$DESTDIR BUILD_ROOT=$WORKDIR RELEASE="$RELEASE" NIGHTLY="$NIGHTLY" QUARTUS="$QUARTUS" TAG="$TAG" ARTIFACT_NAME_PREFIX=$ARTIFACT_NAME_PREFIX scripts/build-sw-anlt.sh 2>&1 | tee "$ARC_LOG"
          ARC_RC=${PIPESTATUS[0]}
          STATUS=$(grep -oE 'finished with exit status -?[0-9]+' "$ARC_LOG" | tail -1 | awk '{print $NF}' || true)
          echo "arc submit rc=$ARC_RC parsed_job_status=${STATUS:-missing}"
          if [ "$ARC_RC" -ne 0 ]; then
            echo "ERROR: arc submit exited $ARC_RC"
            exit 1
          fi
          if [ "$STATUS" != "0" ]; then
            echo "ERROR: ARC job did not finish with status 0 (got '${STATUS:-missing}')"
            exit 1
          fi
          test -f "$DESTDIR/.sw_build_ok" || {
            echo "ERROR: build-sw-anlt.sh did not write .sw_build_ok — Yocto did not finish publishing"
            ls -la "$DESTDIR" 2>/dev/null || true
            exit 1
          }

      - name: Copy outputs
        if: success()
        run: |
          set -e
          echo "=== DESTDIR after build: $DESTDIR ==="
          ls -la "$DESTDIR"
          test -f "$DESTDIR/.sw_build_ok" || { echo "ERROR: SW build did not complete successfully"; exit 1; }
          test -f "$DESTDIR/kernel_sed.itb" || { echo "ERROR: missing kernel_sed.itb"; exit 1; }
          test -f "$DESTDIR/gsrd-console-image-agilex7.tar.gz" || { echo "ERROR: missing console image"; exit 1; }
          rsync -ri --exclude=.sw_build_ok "$DESTDIR"/. .
          # Single archive — multi-file ~700MB upload often hits "operation was canceled" on self-hosted
          tar -czf ptp-sw-artifacts.tgz \
            gsrd-console-image-agilex7.tar.gz \
            kernel_sed.itb \
            kernel_sed_PTP_*.itb \
            sdimage.tar.gz \
            u-boot-spl-dtb.hex
          ls -lh ptp-sw-artifacts.tgz

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME_PREFIX }}-sw-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: ptp-sw-artifacts.tgz
    
      - name: Purge workdir
        if: always()
        run: |
          rm -rf $WORKDIR
