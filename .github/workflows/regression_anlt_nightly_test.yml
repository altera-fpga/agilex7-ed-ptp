name: ANLT and NON-ANLT Regression test
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      triggered_by_schedule:
        type: boolean
        required: false
        default: false
      triggered_by_tag_push:
        type: boolean
        required: false
        default: false
      release_tag:
        type: string
        required: false
        default: ""
      designs:
        required: true
        type: string
      build_type:
        required: false
        type: string
      triggered_by_quartus_upgrade:
        type: boolean
        required: false
        default: false
      quartus_version:
        required: false
        type: string
  
jobs:
  regression_test:
    timeout-minutes: 600
    runs-on: [self-hosted, psgpac]
    env:
      PNG_SSH_HOST: sys_testing_ba@apgcp0d551103.png.altera.com
      REPO: https://github.com/altera-innersource/applications.fpga.system-example-designs.test-automation.git
      REPORT_PATH: /nfs/site/disks/pac_release_1/github/psgpac/sed/regression_test/tests/reports
      TEST_DIR: /nfs/site/disks/swuser_work_sys_testing_ba/Nightly_Automation_Testing/regtest/1588ptp/agx7/fm87
      BASE_DIR: /nfs/site/disks/swuser_work_sys_testing_ba/Nightly_Automation_Testing
      EXEC_SCRIPT_DIR: automation_repo/scripts/1588ptp/agx7/fm87/ANLT_NON_ANLT
      TEST_CASES_DIR: automation_repo/regtest/1588ptp/agx7/fm87/ANLT_NON_ANLT
      UTIL_DIR: automation_repo/regtest/util/1588ptp_agx7
      QUARTUS_BUILD_PATH: /nfs/site/disks/pac_release_1/github/psgpac/sed/quartus_upgrade/build/1588ptp/agx7/fm87/pdk

    steps:
      - name: env set up
        run: |
            echo "TEST_DIR=${{ env.TEST_DIR }}/${{ inputs.designs }}" >> $GITHUB_ENV

      - name: cloning automation repo
        run: |
          ssh -t "$PNG_SSH_HOST" << 'EOF'
          set -e
          set -x;uname -a
          export http_proxy=http://proxy-dmz.altera.com:911
          export https_proxy=http://proxy-dmz.altera.com:912
          mkdir -p '${{ env.TEST_DIR }}'
          cd ${{ env.TEST_DIR }} && rm -rf *
          git clone ${{ env.REPO }} automation_repo
          EOF

      - name: Manual test execution(default executes nightly latest artifacts)
        if: ${{ inputs.build_type == 'nightly' }}
        run: |
          ssh -t "$PNG_SSH_HOST" << 'EOF' 
          set -x;uname -a
          cd ${{ env.TEST_DIR }}
          cp -rf ${{ env.EXEC_SCRIPT_DIR }}/* ${{ env.TEST_DIR }}
          cp -rf ${{ env.TEST_CASES_DIR }}/* ${{ env.TEST_DIR }}
          cp -rf ${{env.UTIL_DIR }}/* ${{ env.TEST_DIR }}
          rm -rf automation_repo
          perl Test_handling.pl --image="${{ inputs.designs }}" --param_build_type=nightly --param_build_id=latest
          EOF

      - name: Run test for ${{ inputs.designs }}
        if: ${{ inputs.triggered_by_schedule || inputs.triggered_by_tag_push || inputs.triggered_by_quartus_upgrade  }}
        run: |
          ssh -t "$PNG_SSH_HOST" << 'EOF' 
          set -x;uname -a
          cd ${{ env.TEST_DIR }}
          cp -rf ${{ env.EXEC_SCRIPT_DIR }}/* ${{ env.TEST_DIR }}
          cp -rf ${{ env.TEST_CASES_DIR }}/* ${{ env.TEST_DIR }}
          cp -rf ${{env.UTIL_DIR }}/* ${{ env.TEST_DIR }}
          rm -rf automation_repo

          if [[ ${{ inputs.triggered_by_schedule }} == "true" ]]; then
            perl Test_handling.pl --image="${{ inputs.designs }}" --param_build_type=nightly --param_build_id=latest
          elif [[ ${{ inputs.triggered_by_tag_push }} == "true" ]]; then
            perl Test_handling.pl --image="${{ inputs.designs }}" --param_build_type=release --param_build_id=${{ inputs.release_tag }}
          elif [[ ${{ inputs.triggered_by_quartus_upgrade }} == "true" ]]; then
            perl Test_handling.pl --image="${{ inputs.designs }}" --param_build_type=local --param_build_id=${{ env.QUARTUS_BUILD_PATH }}/${{ inputs.designs }}/latest
          fi
          EOF

      - name: check csv 
        run: |
          ssh -t "$PNG_SSH_HOST" << 'EOF'
          cd ${{ env.TEST_DIR }}
          if [ -f *.csv ];then
            echo "CSV File Generated"
            cat *.csv
          else
            echo "CSV File Not generated"
            exit 1
          fi
          EOF

  reporting:
    needs: [regression_test]
    runs-on: [self-hosted, psgpac]
    env:
      WORKDIR: /nfs/site/disks/pac_release_1/github/psgpac/${{ github.repository }}/${{ inputs.designs }}/${{ github.run_id }}.${{ github.run_attempt }}
      REPO: https://github.com/altera-innersource/applications.fpga.system-example-designs.test-automation.git
      EMAIL_SCRIPT_PATH: /nfs/site/disks/pac_release_1/github/psgpac/sed/regression_test/tests/scripts/1588ptp/anlt_non_anlt
    steps:
      - name: Create workdir
        run: |
          mkdir -pv $WORKDIR;cd $WORKDIR
          git clone ${{ env.REPO }} automation_repo

      - name: sending reports of manual run
        run: |
          cd ${{env.WORKDIR}}/automation_repo/scripts/report 
          if [[ "${{ inputs.build_type }}" == 'nightly' ]]; then
            python3 sed_test_report.py --param-sed-design=1588ptp --param-sed-devkit=agx7-fm87-pdk  --param-sed-config=${{ inputs.designs }} --param-build-type=nightly --param-build-id=latest
          fi
          
      - name: sending reports of quartus_upgrade/Nightly/release
        run: |
          cd ${{env.WORKDIR}}/automation_repo/scripts/report 
          if [[ ${{ inputs.triggered_by_schedule }} == "true" ]]; then
            python3 sed_test_report.py --param-sed-design=1588ptp --param-sed-devkit=agx7-fm87-pdk  --param-sed-config=${{ inputs.designs }} --param-build-type=nightly --param-build-id=latest
          elif [[ ${{ inputs.triggered_by_tag_push }} == "true" ]]; then
            python3 sed_test_report.py --param-sed-design=1588ptp --param-sed-devkit=agx7-fm87-pdk  --param-sed-config=${{ inputs.designs }} --param-build-type=release --param-build-id=${{ inputs.release_tag }}
          elif [[ ${{ inputs.triggered_by_quartus_upgrade }} == "true" ]]; then
           python3 sed_test_report.py --param-sed-design=1588ptp --param-sed-devkit=agx7-fm87-pdk  --param-sed-config=${{ inputs.designs }} --param-build-type=quartus --param-build-id=latest --param-quart-ver=${{ inputs.quartus_version }}
          fi

      - name: Purge workdir
        if: always()
        run: |
          rm -rf $WORKDIR

      # - name: sending reports
      #   if: ${{ inputs.triggered_by_schedule || inputs.triggered_by_tag_push }}
      #   run: |
      #     set -x
      #     cd ${{env.EMAIL_SCRIPT_PATH}}/${{ inputs.designs }}
      #     var="${{ inputs.designs }}"
      #     lower_str=$(echo "$var" | tr '[:upper:]' '[:lower:]')
      #     echo "$lower_str"
      #     python3 sed_1588ptp_${lower_str}_agx7_fm87_pdk_report.py
