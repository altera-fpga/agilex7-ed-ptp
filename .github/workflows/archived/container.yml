name: build container
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/container.yml'
      - 'container/ubuntu2204.def'
      - 'scripts/container.sh'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/container.yml'
      - 'container/ubuntu2204.def'
      - 'scripts/container.sh'
jobs:
  build:
    runs-on: [self-hosted, psgpac]
    env:
      WORKDIR: /nfs/site/disks/pac_release_1/github/psgpac/${{ github.repository }}/${{ github.run_id }}.${{ github.run_attempt }}
      DESTDIR: /nfs/site/disks/pac_release_1/github/psgpac/${{ github.repository }}/container
    steps:
      - name: Create workdir
        id: workdir
        run: |
          mkdir -pv $WORKDIR

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy repository
        run: |
          rsync -rl --exclude=.git "$GITHUB_WORKSPACE"/. "$WORKDIR"

      - name: Build container
        run: |
          nbjob run --mode interactive --tar altera_sc_normal --qslot /psg/infra/default --class 'SLES15&&1C&&4G' --class-reservation 'disk=20' --isolate-tmp loop --container-platform build $WORKDIR scripts/container.sh container/ubuntu2204.def ubuntu2204.sif

      - name: Install container
        if: github.ref == 'refs/heads/main'
        run: |
          ln -fn $WORKDIR/ubuntu2204.sif $DESTDIR/ubuntu2204.sif

      - name: Purge workdir
        run: |
          rm -rf $WORKDIR
