name: Manual ANLT/NON_ANLT Regression Run
run-name: ${{ format('Manual Regression - {0} - {1}', inputs.build_type, inputs.designs) }}
on:
  workflow_dispatch:
    inputs:
      designs:
        description: 'Enter designs to test(Ex:10G_ANLT,10G_NON_ANLT)'
        required: false
        default: " "
        type: string
      build_type:
        description: 'Select Build type(Ex:nightly/weekly)'
        required: false
        default: nightly
        type: choice
        options:
          - nightly
          - weekly 
        
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string


jobs:
  prepare-matrix:
    runs-on: [self-hosted, psgpac]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build_type: ${{ steps.set-matrix.outputs.build_type }}
    steps:
      - id: set-matrix
        run: |
          if [ -z "${{ github.event.inputs.designs }}" ]; then
            MATRIX='["10g_anlt","10g_non_anlt","25g_anlt","25g_non_anlt", "50g_anlt", "50g_non_anlt", "100g_anlt", "100g_non_anlt", "10g_25g_non_anlt_dr"]'
          else
            MATRIX=$(echo '${{ github.event.inputs.designs }}' | tr -d ' ' | tr ',' '\n' | jq -R -s -c 'split("\n")[:-1]')
          fi
          BUILD_TYPE=$( echo '${{ github.event.inputs.build_type }}' | xargs)
          if echo "$BUILD_TYPE" | grep -Eq '^(nightly|release|weekly)$'; then
              echo "::notice title=VALID INPUT:: Valid build type - $BUILD_TYPE"
              echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          else
              echo "::error title=INVALID INPUT:: Invalid build type - $BUILD_TYPE"
              exit 1
          fi
          echo "Running Desings: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          
          
  Nightly-test:
    if: github.event_name == 'workflow_dispatch' && needs.prepare-matrix.outputs.build_type == 'nightly'
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix:
        designs: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
  
    uses: ./.github/workflows/regression_anlt_nightly_test.yml
    with:
       designs: ${{ matrix.designs }}
       build_type: ${{ needs.prepare-matrix.outputs.build_type }}
       triggered_by_schedule: ${{ github.event_name == 'schedule' }}
       triggered_by_tag_push: ${{ startsWith(github.ref, 'refs/tags/') }}
       release_tag: ${{ github.ref_name || '' }}


  Weekly-test:
    if: github.event_name == 'workflow_dispatch' && needs.prepare-matrix.outputs.build_type == 'weekly'
    needs: prepare-matrix
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        designs: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
  
    uses: ./.github/workflows/regression_anlt_weekly_test.yml
    with:
       designs: ${{ matrix.designs }}
       build_type: ${{ needs.prepare-matrix.outputs.build_type }}
       triggered_by_schedule: ${{ github.event_name == 'schedule' }}
       triggered_by_tag_push: ${{ startsWith(github.ref, 'refs/tags/') }}
       release_tag: ${{ github.ref_name || '' }}

