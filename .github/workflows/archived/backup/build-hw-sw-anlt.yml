      PSGPAC_SSH_KEY: ${{ secrets.PSGPAC_SSH_KEY }}
      SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}

  HW_100G_ANLT:
    if: always() && needs.check_changes.outputs.changes_detected == 'true'
    needs: check_changes
    uses: ./.github/workflows/build-hw-anlt-2P100G.yml
    with:
       triggered_by_schedule: ${{ github.event_name == 'schedule' }}
       triggered_by_tag_push: ${{ startsWith(github.ref, 'refs/tags/') }}
       release_tag: ${{ github.ref_name || '' }}
       branch_name: ${{ needs.check_changes.outputs.resolved_branch }}
    secrets:
      PSGPAC_SSH_KEY: ${{ secrets.PSGPAC_SSH_KEY }}
      SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}

  HW_100G_NON_ANLT:
    if: always() && needs.check_changes.outputs.changes_detected == 'true'
    needs: check_changes
    uses: ./.github/workflows/build-hw-non-anlt-2P100G.yml
    with:
       triggered_by_schedule: ${{ github.event_name == 'schedule' }}
       triggered_by_tag_push: ${{ startsWith(github.ref, 'refs/tags/') }}
       release_tag: ${{ github.ref_name || '' }}
       branch_name: ${{ needs.check_changes.outputs.resolved_branch }}
    secrets:
      PSGPAC_SSH_KEY: ${{ secrets.PSGPAC_SSH_KEY }}
      SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}

  build_software:
    if: always() && needs.check_changes.outputs.changes_detected == 'true'
    needs: [check_changes, HW_10G_ANLT, HW_10G_NON_ANLT, HW_25G_NON_ANLT, HW_25G_ANLT,  HW_50G_ANLT, HW_50G_NON_ANLT,  HW_100G_ANLT, HW_100G_NON_ANLT]
    uses: ./.github/workflows/build-sw-anlt.yml
    with:
       triggered_by_schedule: ${{ github.event_name == 'schedule' }}
       triggered_by_tag_push: ${{ startsWith(github.ref, 'refs/tags/') }}
       release_tag: ${{ github.ref_name || '' }}
       branch_name: ${{ needs.check_changes.outputs.resolved_branch }}
    secrets:
      PSGPAC_SSH_KEY: ${{ secrets.PSGPAC_SSH_KEY }}
      SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}

  TEST:
    if: always() && needs.check_changes.outputs.test_run == 'true'
    needs: [check_changes, build_software]
    strategy:
      fail-fast: false
      matrix:
        designs: [10G_ANLT, 10G_NON_ANLT, 25G_ANLT, 25G_NON_ANLT, 50G_ANLT, 50G_NON_ANLT, 100G_ANLT, 100G_NON_ANLT]

    uses: ./.github/workflows/test_anlt_regression.yml
    with:
       designs: ${{ matrix.designs }}
       triggered_by_schedule: ${{ github.event_name == 'schedule' }}
       triggered_by_tag_push: ${{ startsWith(github.ref, 'refs/tags/') }}
       release_tag: ${{ github.ref_name || '' }}
    secrets:
      PSGPAC_SSH_KEY: ${{ secrets.PSGPAC_SSH_KEY }}
      SYS_TESTING_BA_SSH_KEY: ${{ secrets.SYS_TESTING_BA_SSH_KEY }}
      SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
      PNG_SSH_HOST_KEY: ${{ secrets.PNG_SSH_HOST_KEY }}
