       triggered_by_tag_push: ${{ startsWith(github.ref, 'refs/tags/') }}
       release_tag: ${{ github.ref_name || '' }}
       branch_name: ${{ needs.check_changes.outputs.resolved_branch }}
    secrets:
      PSGPAC_SSH_KEY: ${{ secrets.PSGPAC_SSH_KEY }}
      SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}

  HW_25G_NON_ANLT:
    if: always() && needs.check_changes.outputs.changes_detected == 'true'
    needs: check_changes
    uses: ./.github/workflows/build-hw-non-anlt-2P25G.yml
    with:
       triggered_by_schedule: ${{ github.event_name == 'schedule' }}
       triggered_by_tag_push: ${{ startsWith(github.ref, 'refs/tags/') }}
       release_tag: ${{ github.ref_name || '' }}
       branch_name: ${{ needs.check_changes.outputs.resolved_branch }}
    secrets:
      PSGPAC_SSH_KEY: ${{ secrets.PSGPAC_SSH_KEY }}
      SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}

  HW_50G_ANLT:
    if: always() && needs.check_changes.outputs.changes_detected == 'true'
    needs: check_changes
    uses: ./.github/workflows/build-hw-anlt-2P50G.yml
    with:
       triggered_by_schedule: ${{ github.event_name == 'schedule' }}
       triggered_by_tag_push: ${{ startsWith(github.ref, 'refs/tags/') }}
       release_tag: ${{ github.ref_name || '' }}
       branch_name: ${{ needs.check_changes.outputs.resolved_branch }}
    secrets:
      PSGPAC_SSH_KEY: ${{ secrets.PSGPAC_SSH_KEY }}
      SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}

  HW_50G_NON_ANLT:
    if: always() && needs.check_changes.outputs.changes_detected == 'true'
    needs: check_changes
    uses: ./.github/workflows/build-hw-non-anlt-2P50G.yml
    with:
