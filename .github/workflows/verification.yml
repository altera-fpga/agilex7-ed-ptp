name: sim verification
on:
  workflow_dispatch:
    inputs:
      run_hw:
        description: 'Run HW job - (true/false)'
        required: true
        default: 'true'

  workflow_call:
    inputs:
      run_hw:
        required: true
        type: string

jobs:
  sim_verification:
    if: inputs.run_hw == 'true'
    runs-on: [self-hosted, psgpac]
    env:
      WORKDIR: /nfs/site/disks/pac_release_1/github/psgpac/${{ github.repository }}/${{ github.run_id }}.${{ github.run_attempt }}
      LOGDIR: /nfs/site/disks/pac_release_1/github/psgpac/${{ github.repository }}/${{ github.run_id }}.${{ github.run_attempt }}/src/hw/verification/log_files
      LOG_PREFIX: agilex5-sm72-ed-1588ptp-10G-sim-test

    steps:
      - name: Create workdir
        id: workdir
        run: |
          mkdir -pv $WORKDIR
          mkdir -pv $LOGDIR

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy inputs
        run: |
          rsync -rl --exclude=.git "$GITHUB_WORKSPACE"/. "$WORKDIR"
      
      - name: compile and build 
        run: |
          cd ${{ env.WORKDIR }}/scripts
          chmod +x sim_compile_build.sh
          ./sim_compile_build.sh
          TEST_EXIT_CODE=$?
          if [ $TEST_EXIT_CODE -ne 0 ]; then
              echo "--- compile or build FAILED ($TEST_EXIT_CODE) ---"
              exit 1
          else
              echo "--- compile and build PASSED  ---"
          fi
      
      - name: TEST sequence fptp_csr_seq
        id: fptp_csr_seq
        run: |
          cd ${{ env.WORKDIR }}/scripts
          chmod +x verification.sh
          ./verification.sh fptp_csr_test fptp_csr_seq
          cp -rf ${{env.WORKDIR}}/src/hw/verification/sim/fptp_csr_test/simulate_fptp_csr_test.log ${{ env.LOGDIR }}
          if grep "TEST : Passed" ${{env.WORKDIR}}/src/hw/verification/sim/fptp_csr_test/simulate_fptp_csr_test.log ; then
              echo "--- Sequence: fptp_csr_seq verification PASSED ---"
          else
              echo "--- Sequence: fptp_csr_seq verification FAILED  ---"
              exit 1
          fi
        continue-on-error: true

      - name: Copy logs
        run: |
          rsync -ri "$LOGDIR"/. .
          
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LOG_PREFIX }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            *.log
    
      - name: Purge workdir
        if: always()
        run: |
          echo "clean workspace hold"
          rm -rf $WORKDIR
      
      - name: check for any above test failure and report
        if: steps.fptp_csr_seq.outcome == 'failure'
        run: | 
          echo "--- Test Summary ---"
          if [[ "${{ steps.fptp_csr_seq.outcome }}" == "failure" ]]; then
            echo "❌ Sequence: fptp_csr_seq  failed."
          fi
          echo "--------------------"
          echo "One or more Sequence tests failed. Failing the Job"
          exit 1
