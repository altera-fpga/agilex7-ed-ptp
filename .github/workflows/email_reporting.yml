name: Email report
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      triggered_by_schedule:
        type: boolean
        required: false
        default: false
      triggered_by_tag_push:
        type: boolean
        required: false
        default: false
      release_tag:
        type: string
        required: false
        default: ""
  
  
jobs:
  reporting:
    runs-on: [self-hosted, psgpac]
    env:
      SED_REGRESSION_PATH: /nfs/site/disks/pac_release_1/github/psgpac/sed/regression_test/tests/scripts/1588ptp
    steps:
      - name: sending reports
        # if: ${{ inputs.triggered_by_schedule || inputs.triggered_by_tag_push }}
        run: |
          cd ${{env.SED_REGRESSION_PATH}} && \
          python3 sed_1588ptp_2x25g_mcqos_agx7_fm87_pdk_report.py


