header:
  version: 17
  includes:
    - kas/machine.yml
    - kas/bsp.yml
# From environment: PTP_DESIGN=25G_ANLT kas shell kas.yml ...
# or exported by build.sh / kas_build.sh
env:
  PTP_DESIGN: null
  YOCTO_TMPDIR: null
  GITHUB_ACTIONS: null
repos:
  bitbake:
    url: https://github.com/openembedded/bitbake.git
    branch: "2.18"
    layers:
      .: disabled
  openembedded-core:
    url: https://github.com/openembedded/openembedded-core.git
    branch: wrynose
    layers:
      meta:
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    layers:
      meta-poky:
      meta-yocto-bsp:
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: wrynose
    layers:
      meta-oe:
      meta-python:
      meta-networking:
  meta-clang:
    url: https://github.com/kraj/meta-clang.git
    branch: wrynose
  meta-altera-fpga:
    url: https://github.com/altera-fpga/meta-altera-fpga.git
    branch: wrynose
    layers:
      meta-altera-bsp:
      meta-altera-platform:
  meta-custom:
    path: meta-custom
local_conf_header:
  boot-source: |
    SSBL_BOOT_SOURCE ?= "mmc0"
    KERNEL_BOOTARGS_SD_MMC ?= ""
  device-tree: |
    CUSTOM_UBOOT_DEVICE_TREE = "0"
    CUSTOM_LINUX_DEVICE_TREE = "1"
    # FPGA_LINUX_DTB_FILE set by meta-custom/conf/ptp-solution.inc from PTP_DESIGN
  # RBF files in meta-custom/recipes-fpga/fpga-bitstream/files/
  # FPGA_RBF_FILE set by ptp-solution.inc from PTP_DESIGN
  fpga-bitstream: |
    FPGA_ENABLE_CORE_PGM ?= "1"
  solution: |
    # SOLUTION set by ptp-solution.inc from PTP_DESIGN
    IMAGE_TYPE = "gsrd"
  ptp-design: |
    # Default if PTP_DESIGN is not exported
    PTP_DESIGN ??= "25G_ANLT"
    require ${LAYERDIR_meta_custom}/conf/ptp-solution.inc
  kernel-modules: |
    KERNEL_MODULE_PROBECONF = "cfg80211"
    module_conf_cfg80211 = "blacklist cfg80211"
  build-params: |
    # ARC SW job is constrained — -j 32 contributes to ARC -1004
    PARALLEL_MAKE = "${@'-j 8' if d.getVar('GITHUB_ACTIONS') == 'true' else '-j 32'}"
    BB_NUMBER_THREADS = "${@'8' if d.getVar('GITHUB_ACTIONS') == 'true' else '32'}"
  ci-tmpdir: |
    # Keep YOCTO_TMPDIR on node-local storage.
    TMPDIR = "${@d.getVar('YOCTO_TMPDIR') or '${TOPDIR}/tmp'}"
  ci-disk: |
    # Shrink TMPDIR footprint (ARC local scratch); stop before disk-kill (-1004)
    INHERIT += "rm_work"
    BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},2G,100K HALT,${TMPDIR},1G,10K"
  ci-git-creds: |
    # CI (build-sw-anlt.sh) writes yocto_linux/.gitconfig and exports GIT_CONFIG_GLOBAL.
    # Do not hard-code the path here — that breaks local builds when .gitconfig is absent.
    # do_fetch uses a temp HOME; passthrough keeps CI insteadOf+PAT / TLS env in task env.
    BB_ENV_PASSTHROUGH_ADDITIONS .= " GIT_CONFIG_GLOBAL GIT_SSL_NO_VERIFY SSL_CERT_FILE CURL_CA_BUNDLE GIT_SSL_CAINFO REQUESTS_CA_BUNDLE"
